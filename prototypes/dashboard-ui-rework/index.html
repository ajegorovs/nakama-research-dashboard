<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakama research dashboard — information-architecture rework prototype</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◧</span>
    <span class="brand-text">Research dashboard <span class="brand-sub">· IA rework prototype</span></span>
  </div>

  <nav class="tabs" aria-label="Dashboard sections">
    <button class="tab" data-view="overview" aria-current="page">Overview</button>
    <button class="tab" data-view="topics">Projects</button>
    <button class="tab" data-view="people">People</button>
    <button class="tab" data-view="repositories">Repositories</button>
    <button class="tab" data-view="progress">Progress</button>
  </nav>

  <div class="searchbox">
    <label for="search" class="visually-hidden">Search projects, workstreams and tasks</label>
    <input id="search" type="search" placeholder="Search projects, workstreams, tasks…" autocomplete="off">
  </div>
</header>

<main id="main" tabindex="-1">
  <section id="view-overview" class="view" hidden aria-label="Overview"></section>
  <section id="view-topics" class="view" hidden aria-label="Projects"></section>
  <section id="view-people" class="view" hidden aria-label="People"></section>
  <section id="view-repositories" class="view" hidden aria-label="Repositories"></section>
  <section id="view-progress" class="view" hidden aria-label="Progress"></section>
</main>

<div id="search-results" class="search-results" hidden aria-live="polite"></div>

<footer class="foot">
  <span id="build-identity">Loading build identity…</span>
  <span class="foot-sep" aria-hidden="true">·</span>
  <span id="data-provenance">Loading provenance…</span>
  <span class="foot-sep" aria-hidden="true">·</span>
  <span>Read-only frozen data — no live instance is contacted by this page.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
